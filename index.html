<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FreshTrack - Food Storage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML5 QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-white border-b px-4 py-3 sticky top-0 z-20 flex justify-between items-center shadow-sm">
    <h1 class="text-xl font-bold text-red-600 tracking-tight">FreshTrack</h1>
    <button id="openScannerBtn" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
      Scan Lid
    </button>
  </header>

  <!-- Scanner Modal -->
  <div id="scannerModal" class="fixed inset-0 bg-black/80 z-50 hidden flex-col items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm overflow-hidden p-4 relative">
      <div class="flex justify-between items-center mb-3">
        <h2 class="font-bold text-gray-800">Scan Container QR</h2>
        <button id="closeScannerBtn" class="text-gray-500 hover:text-black font-bold text-lg">&times;</button>
      </div>
      <div id="qr-reader" class="w-full rounded-lg overflow-hidden border"></div>
      <p class="text-xs text-gray-500 text-center mt-3">Align the QR code on your container lid within the box</p>
    </div>
  </div>

  <!-- Food Entry Form Modal -->
  <div id="itemModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
      <h2 id="modalTitle" class="text-lg font-bold mb-1">Add Food Item</h2>
      <p id="modalContainerId" class="text-xs font-mono text-gray-500 mb-4 truncate"></p>

      <form id="foodForm" class="space-y-4">
        <input type="hidden" id="formContainerId">

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Item Name</label>
          <input type="text" id="itemName" required placeholder="e.g., Cooked Beef Stew" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-red-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Category</label>
            <select id="itemCategory" class="w-full border rounded-lg p-2.5 text-sm bg-white">
              <option value="leftovers">Cooked Leftovers (10d)</option>
              <option value="raw_meat">Raw Meat/Fish (6d)</option>
              <option value="cheese">Hard Cheese (28d)</option>
              <option value="vegetables">Fresh Produce (14d)</option>
              <option value="dry">Dry / Pantry (180d)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Storage Zone</label>
            <select id="itemLocation" class="w-full border rounded-lg p-2.5 text-sm bg-white">
              <option value="fridge">Fridge</option>
              <option value="freezer">Freezer</option>
              <option value="pantry">Pantry</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Sealed Date</label>
          <input type="date" id="itemDate" class="w-full border rounded-lg p-2.5 text-sm">
        </div>

        <div class="flex gap-2 pt-2">
          <button type="button" id="cancelFormBtn" class="w-1/2 py-2.5 border rounded-lg text-sm font-semibold text-gray-600">Cancel</button>
          <button type="submit" class="w-1/2 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-semibold">Save Storage</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Main Container View -->
  <main class="max-w-2xl mx-auto p-4 space-y-4">
    <div class="flex justify-between items-center">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-500">Tracked Containers</h2>
      <span id="activeCount" class="text-xs font-semibold bg-gray-200 px-2 py-0.5 rounded-full text-gray-700">0 Items</span>
    </div>

    <!-- Active List -->
    <div id="containerList" class="space-y-3">
      <!-- Populated via JavaScript -->
    </div>
  </main>

  <script>
    // Shelf life estimates for vacuum-sealed food (days)
    const SHELF_LIFE_DAYS = {
      leftovers: 10,
      raw_meat: 6,
      cheese: 28,
      vegetables: 14,
      dry: 180
    };

    let html5QrCode = null;
    let inventory = JSON.parse(localStorage.getItem('freshtrack_inventory') || '[]');

    function saveInventory() {
      localStorage.setItem('freshtrack_inventory', JSON.stringify(inventory));
      renderList();
    }

    function calculateExpiry(storedDateStr, category, location) {
      const storedDate = new Date(storedDateStr);
      let days = SHELF_LIFE_DAYS[category] || 7;
      if (location === 'freezer') days = days * 4; // Freezer extends shelf life significantly
      const expiry = new Date(storedDate);
      expiry.setDate(expiry.getDate() + days);
      return expiry;
    }

    function renderList() {
      const container = document.getElementById('containerList');
      document.getElementById('activeCount').innerText = `${inventory.length} Containers`;

      if (inventory.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-white rounded-xl border border-dashed border-gray-300">
            <p class="text-gray-400 text-sm">No food currently tracked.</p>
            <p class="text-xs text-gray-500 mt-1">Tap "Scan Lid" to link your first Zwilling container.</p>
          </div>
        `;
        return;
      }

      const now = new Date();
      container.innerHTML = inventory.map((item, index) => {
        const expiry = new Date(item.expiryDate);
        const diffDays = Math.ceil((expiry - now) / (1000 * 60 * 60 * 24));
        const isExpired = diffDays <= 0;
        const isNear = diffDays > 0 && diffDays <= 3;

        const badgeColor = isExpired ? 'bg-red-100 text-red-700' : isNear ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700';
        const badgeText = isExpired ? 'Expired' : `${diffDays} days left`;

        return `
          <div class="bg-white border rounded-xl p-4 shadow-sm flex flex-col justify-between space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-gray-800 text-base">${item.name}</h3>
                <p class="text-xs text-gray-500">Zone: <span class="capitalize font-medium text-gray-700">${item.location}</span> | Sealed: ${item.sealedDate}</p>
              </div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${badgeColor}">
                ${badgeText}
              </span>
            </div>
            <div class="flex justify-between items-center text-xs text-gray-400 border-t pt-2">
              <span class="font-mono truncate max-w-[150px]">ID: ${item.containerId}</span>
              <button onclick="consumeItem(${index})" class="text-red-600 hover:text-red-800 font-semibold">
                Mark as Eaten / Empty
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function consumeItem(index) {
      inventory.splice(index, 1);
      saveInventory();
    }

    function handleDecodedId(scannedId) {
      closeScanner();
      
      // Check if container is already active
      const existing = inventory.find(i => i.containerId === scannedId);
      if (existing) {
        if (confirm(`Container already contains: "${existing.name}". Mark as finished and replace?`)) {
          inventory = inventory.filter(i => i.containerId !== scannedId);
          saveInventory();
          openItemForm(scannedId);
        }
      } else {
        openItemForm(scannedId);
      }
    }

    function openItemForm(containerId) {
      document.getElementById('formContainerId').value = containerId;
      document.getElementById('modalContainerId').innerText = `Container ID: ${containerId}`;
      document.getElementById('itemName').value = '';
      document.getElementById('itemDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('itemModal').classList.remove('hidden');
    }

    document.getElementById('foodForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const containerId = document.getElementById('formContainerId').value;
      const name = document.getElementById('itemName').value;
      const category = document.getElementById('itemCategory').value;
      const location = document.getElementById('itemLocation').value;
      const sealedDate = document.getElementById('itemDate').value;
      const expiryDate = calculateExpiry(sealedDate, category, location).toISOString();

      inventory.unshift({ containerId, name, category, location, sealedDate, expiryDate });
      saveInventory();
      document.getElementById('itemModal').classList.add('hidden');
    });

    document.getElementById('cancelFormBtn').addEventListener('click', () => {
      document.getElementById('itemModal').classList.add('hidden');
    });

    // Scanner Controls
    const scannerModal = document.getElementById('scannerModal');
    document.getElementById('openScannerBtn').addEventListener('click', () => {
      scannerModal.classList.remove('hidden');
      scannerModal.classList.add('flex');
      html5QrCode = new Html5Qrcode("qr-reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        (decodedText) => handleDecodedId(decodedText)
      ).catch(err => console.error("Camera access failed", err));
    });

    function closeScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          scannerModal.classList.add('hidden');
          scannerModal.classList.remove('flex');
        }).catch(() => {
          scannerModal.classList.add('hidden');
          scannerModal.classList.remove('flex');
        });
      } else {
        scannerModal.classList.add('hidden');
        scannerModal.classList.remove('flex');
      }
    }

    document.getElementById('closeScannerBtn').addEventListener('click', closeScanner);

    // Initial render
    renderList();
  </script>
</body>
</html>
